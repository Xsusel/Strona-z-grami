<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu-container" class="container">
        <h1>Monopoly Online</h1>
        <form id="nickname-form">
            <input type="text" id="nickname-input" placeholder="Podaj swój nick" required>
            <button type="submit">Zatwierdź</button>
        </form>
        <div id="menu-buttons" style="display: none;">
            <button id="create-game-button">Stwórz nową grę</button>
            <p>...lub dołącz, używając linku od znajomego.</p>
        </div>
    </div>

    <div id="invite-link-container" class="container" style="display: none;">
        <h2>Zaproś znajomych!</h2>
        <p>Wyślij im ten link, aby dołączyli do gry:</p>
        <input type="text" id="invite-link-input" readonly>
        <button id="start-game-button">Start</button>
    </div>

    <div id="game-container" style="display: none;">
        <div id="monopoly-board">
            <!-- 40 pól planszy zostanie wygenerowane dynamicznie przez JS -->
        </div>
        <div id="player-panel">
            <!-- Informacje o graczach, kostki, przyciski akcji -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
            <div id="modal-buttons"></div>
        </div>
    </div>
</body>
</html>
