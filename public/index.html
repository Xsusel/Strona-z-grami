<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Słowny Impostor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container" class="container">
        <h1>Witaj!</h1>
        <form id="login-form">
            <input type="text" id="nickname-input" placeholder="Podaj swój nick" required>
            <button type="submit">Dalej</button>
        </form>
    </div>

    <div id="game-selection-container" class="container" style="display: none;">
        <h2>Wybierz Grę</h2>
        <div id="game-list">
            <button class="game-select-button" data-game="wordImpostor">Słowny Impostor</button>
            <button class="game-select-button" data-game="drawingImpostor">Rysunkowy Impostor</button>
        </div>
    </div>

    <div id="lobby-container" class="container" style="display: none;">
        <h2>Poczekalnia</h2>
        <div class="lobby-layout">
            <div id="rooms-list-container">
                <h3>Dostępne Pokoje</h3>
                <div id="rooms-list"></div>
            </div>
            <div id="create-room-container">
                <h3>Stwórz Nowy Pokój</h3>
                <form id="create-room-form">
                    <input type="text" id="room-name-input" placeholder="Nazwa pokoju" required>
                    <input type="password" id="room-password-input" placeholder="Hasło (opcjonalne)">
                    <button type="submit">Stwórz</button>
                </form>
            </div>
        </div>
        <button id="back-to-game-selection">Wróć do wyboru gry</button>
    </div>

    <div id="room-container" class="container" style="display: none;">
        <h2 id="room-name-header"></h2>
        <div id="players-list"></div>
        <button id="start-game-button" style="display: none;">Start</button>
        <button id="leave-room-button">Opuść pokój</button>
    </div>

    <div id="game-container" class="container" style="display: none;">
        <h2 id="game-word-header"></h2>
        <p id="game-info"></p>
        <div id="associations-list"></div>
        <form id="association-form">
            <input type="text" id="association-input" placeholder="Twoje skojarzenie" required>
            <button type="submit">Wyślij</button>
        </form>
        <div id="continue-voting-container" style="display: none;">
            <h3>Co robimy dalej?</h3>
            <button class="continue-button">Kontynuuj</button>
            <button class="vote-impostor-button">Głosuj na impostora</button>
        </div>
        <div class="voting-container" style="display: none;">
            <h3>Głosowanie</h3>
            <div class="voting-options"></div>
        </div>
        <button id="guess-word-button" style="display: none;">Zgadnij hasło</button>
    </div>

    <div id="drawing-game-container" class="container" style="display: none;">
        <h2 id="drawing-game-word-header"></h2>
        <p id="drawing-game-info"></p>
        <canvas id="drawing-canvas" width="500" height="500"></canvas>
        <button id="drawing-next-turn-button">Następna tura</button>
        <div id="drawing-continue-voting-container" style="display: none;">
            <h3>Co robimy dalej?</h3>
            <button class="continue-button">Kontynuuj</button>
            <button class="vote-impostor-button">Głosuj na impostora</button>
        </div>
        <div class="voting-container" style="display: none;">
            <h3>Głosowanie</h3>
            <div class="voting-options"></div>
        </div>
        <button id="drawing-guess-word-button" style="display: none;">Zgadnij hasło</button>
    </div>

    <div id="game-over-container" class="container" style="display: none;">
        <h2 id="game-over-winner"></h2>
        <p id="game-over-reason"></p>
        <button id="back-to-lobby-button">Powrót do poczekalni</button>
    </div>

    <!-- Custom Modals -->
    <div id="custom-alert" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="custom-alert-message"></p>
            <button id="custom-alert-ok">OK</button>
        </div>
    </div>

    <div id="custom-prompt" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="custom-prompt-message"></p>
            <input type="text" id="custom-prompt-input">
            <button id="custom-prompt-ok">OK</button>
            <button id="custom-prompt-cancel">Anuluj</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
