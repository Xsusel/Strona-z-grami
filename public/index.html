<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="board.css">
</head>
<body>
    <div id="notification-bar" class="notification"></div>
    <div id="main-menu-container" class="container">
        <h1>Monopoly Online</h1>
        <form id="nickname-form">
            <input type="text" id="nickname-input" placeholder="Podaj swój nick" required>
            <button type="submit">Zatwierdź</button>
        </form>
        <div id="menu-buttons" style="display: none;">
            <button id="create-game-button">Stwórz nową grę</button>
            <p>...lub dołącz, używając linku od znajomego.</p>
        </div>
    </div>

    <div id="invite-link-container" class="container" style="display: none;">
        <h2>Zaproś znajomych!</h2>
        <p>Wyślij im ten link, aby dołączyli do gry:</p>
        <input type="text" id="invite-link-input" readonly>
        <button id="start-game-button">Start</button>
    </div>

    <div id="game-container" style="display: none;">
        <div id="monopoly-board" class="table">
            <div class="board">
                <div class="center">
                    <div class="community-chest-deck">
                        <h2 class="label">Community Chest</h2>
                        <div class="deck"></div>
                    </div>
                    <h1 class="title">MONOPOLY</h1>
                    <div class="chance-deck">
                        <h2 class="label">Chance</h2>
                        <div class="deck"></div>
                    </div>
                </div>

                <div class="space corner go">
                    <div class="container">
                        <div class="instructions">Collect $200.00 salary as you pass</div>
                        <div class="go-word">go</div>
                    </div>
                    <div class="arrow fa fa-long-arrow-left"></div>
                </div>

                <div class="row horizontal-row bottom-row">
                </div>

                <div class="space corner jail">
                    <div class="just">Just</div>
                    <div class="drawing">
                        <div class="container">
                            <div class="name">In</div>
                            <div class="window">
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <div class="bar"></div>
                                <i class="person fa fa-frown-o"></i>
                            </div>
                            <div class="name">Jail</div>
                        </div>
                    </div>
                    <div class="visiting">Visiting</div>
                </div>

                <div class="row vertical-row left-row">
                </div>

                <div class="space corner free-parking">
                    <div class="container">
                        <div class="name">Free</div>
                        <i class="drawing fa fa-car"></i>
                        <div class="name">Parking</div>
                    </div>
                </div>

                <div class="row horizontal-row top-row">
                </div>

                <div class="space corner go-to-jail">
                    <div class="container">
                        <div class="name">Go To</div>
                        <i class="drawing fa fa-gavel"></i>
                        <div class="name">Jail</div>
                    </div>
                </div>

                <div class="row vertical-row right-row">
                </div>
            </div>
        </div>
        <div id="player-panel">
            <!-- Informacje o graczach, kostki, przyciski akcji -->
        </div>
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Wpisz wiadomość...">
        </div>
        <div id="game-log-container">
            <h3>Dziennik gry</h3>
            <div id="game-log"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>

    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title"></h3>
            <p id="modal-text"></p>
            <div id="modal-buttons"></div>
        </div>
    </div>
</body>
</html>
